<ul class="social">
  {{ range .Site.Params.social }}
  {{ $label := .label | default (.icon | humanize) }}
  <li><a href="{{ .url }}" aria-label="{{ $label }}" title="{{ $label }}" {{ if not (hasPrefix .url "mailto:") }}target="_blank" rel="noopener"{{ end }}>{{ partial "icon.html" .icon }}</a></li>
  {{ end }}
</ul>
