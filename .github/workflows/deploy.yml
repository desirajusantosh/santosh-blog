name: Build and deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
      - master

# master and main both deploy to gh-pages; queue runs so their pushes don't race
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.112.5'
          extended: true

      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-resources-${{ hashFiles('content/**/*.jpg', 'content/**/*.JPG', 'content/**/*.jpeg', 'content/**/*.png', 'layouts/**') }}
          restore-keys: hugo-resources-

      - name: Build site
        run: |
          hugo -d public --gc --minify --baseURL "https://desirajusantosh.github.io/santosh-blog/"

      - name: Ensure .nojekyll
        run: touch public/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_branch: gh-pages
          publish_dir: ./public
          allow_empty_commit: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
