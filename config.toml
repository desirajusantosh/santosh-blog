[markup.highlight]
  style = "github-dark"
  noClasses = true

# We only use tag as a taxonomies
# You can add more by yourself
[taxonomies]
  tag = "tags"

[languages]
    [languages.en]
        languageName     = "English"
        languageCode     = "en-us"
        contentDir       = "content/en"
        weight           = 0
        title            = "Santosh Desiraju"
        [languages.en.params]
            description  = "Santosh Desiraju's web site"   # Max 160 characters show in search results
            # footerText   = ""                      # Text to override default footer text (markdown allowed)

