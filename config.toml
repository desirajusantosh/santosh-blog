#baseURL                          = "https://desirajusantosh.github.io/me/"  # Your domain name. Must end with "/"
baseURL = "https://desirajusantosh.github.io/santosh-blog/"
DefaultContentLanguage           = "en"                    # Default language for multilingual sites
# disqusshortname                 = ""                       # https://gohugo.io/content-management/comments
googleAnalytics                  = "G-152PCJSKRY"                       # https://gohugo.io/templates/internal/#google-analytics
canonifyURLs 			 = true
# Add relativeURLs to true
relativeURLs = false
timeout = "10m"                   # first build resizes large photos; can take a few minutes

[params]
    shortName                    = "Santosh Desiraju"     # Shown in the top-left of every page
    favicon                      = "/img/fav.ico"          # Path to favicon file
    dateFormat                   = "Jan 2, 2006"
    email                        = "desirajusantosh@gmail.com"   # E-mail address for contact section
    # customCSS                    = ["foo.css"]             # Include custom css files placed under assets/

    # Configure the home page
    [params.home]
        introHeight              = "fullheight"            # Input either "medium" or "large" or "fullheight"
        showLatest               = true                    # Show latest blog post summary
        showAllPosts             = false                   # Set true to list all posts on home page, or set false to link to separate blog list page
        numberOfProjectsToShow   = 3                       # Maximum number of projects to show on home page. Unset or comment out to show all projects

        localTime                = true                    # Show your current local time in contact section
        timeZone                 = "America/Los_Angeles"   # Your timezone as in the TZ* column of this list: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
        place                    = "Bay Area"
        # Photos that slowly crossfade behind the home page (filenames in content/en/projects/photography)
        frames                   = ["*golden-hills*", "*haleakala-crater*", "*makena-cove-dusk*", "*oahu-golden-hour*", "*above-the-clouds*"]

    # Live weather in the corner of the home page (Open-Meteo, free, no key). Delete this block to turn it off.
    [params.home.weather]
        lat  = 37.55
        lon  = -122.05
        unit = "fahrenheit"

    # Social links appear in the intro and footer. Available icons live in layouts/partials/icon.html
    # (twitter, instagram, linkedin-in, github, paper-plane, mail).
    [[params.social]]
        url   = "https://twitter.com/optimumprimes"
        icon  = "twitter"
        label = "Twitter"
        icon_pack = "fab"
    [[params.social]]
        url   = "https://instagram.com/dsantoshb"
        icon  = "instagram"
        label = "Instagram"
        icon_pack = "fab"
    [[params.social]]
        url   = "https://linkedin.com/in/desirajusantosh"
        icon  = "linkedin-in"
        label = "LinkedIn"
        icon_pack = "fab"
    [[params.social]]
        url = "mailto:desirajusantosh@gmail.com"  # For a direct email link, use "mailto:test@example.org".
        icon = "paper-plane"
        label = "Email"
        icon_pack = "fas"


